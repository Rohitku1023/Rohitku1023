name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Rohitku1023
          outputs: |
            dist/github-snake.svg?color_snake=lime&color_dots=#0d1117,#2d4a1e,#4a7c2f,#6aad3d,#8fd14f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=lime&color_dots=#0d1117,#2d4a1e,#4a7c2f,#6aad3d,#8fd14f
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
